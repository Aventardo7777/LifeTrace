<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="1040" cy="40" r="220" fill="url(#glow)"/>

  <!-- decorative sparkline -->
  <g opacity="0.9">
    <polyline points="760,150 800,140 840,152 880,120 920,132 960,104 1000,116 1040,90 1080,98 1120,76"
      fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1120" cy="76" r="5" fill="#C7D2FE"/>
  </g>
  <g opacity="0.4">
    <polyline points="760,190 800,196 840,184 880,200 920,188 960,206 1000,192 1040,210 1080,202 1120,214"
      fill="none" stroke="#A5B4FC" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <text x="80" y="150" font-family="Inter, 'Segoe UI', sans-serif" font-size="76" font-weight="700" fill="#FFFFFF" letter-spacing="-2">LifeTrace</text>
  <text x="82" y="196" font-family="Inter, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#C7D2FE" letter-spacing="1">Personal Life Data Observatory</text>
  <text x="82" y="232" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="400" fill="#818CF8" letter-spacing="3">人生轨迹实验室</text>
</svg>
